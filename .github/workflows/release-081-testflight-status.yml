name: Verify delivered NailMoods 0.8.1 TestFlight availability
on:
  push:
    branches: [main]
    paths: ['.github/workflows/release-081-testflight-status.yml', 'scripts/ci/apple-testflight-status.py']
  workflow_run:
    workflows: ["NailMoods 0.8.1 TestFlight signed delivery"]
    types: [completed]
permissions:
  contents: read
jobs:
  status:
    if: github.event_name == 'push' || github.event.workflow_run.head_sha == '88d4dab4e7153792a498eed20836228fecb4b27d' && (github.event.workflow_run.conclusion == 'success' || github.event.workflow_run.conclusion == 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
      NAILMOODS_IOS_BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID || 'com.nailmoods.app' }}
      NAILMOODS_IOS_BUILD_NUMBER: '30002'
    steps:
      - uses: actions/checkout@v4
      - name: Read processing, internal/external beta state and existing groups
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          trap 'python3 scripts/ci/apple-api-cleanup.py' EXIT
          python3 - <<'PY'
          import os,pathlib
          directory=pathlib.Path.home()/'.appstoreconnect/private_keys'
          directory.mkdir(parents=True,exist_ok=True)
          key=directory/('AuthKey_'+os.environ['APP_STORE_CONNECT_KEY_ID']+'.p8')
          key.write_text(os.environ['APP_STORE_CONNECT_PRIVATE_KEY'].replace(chr(92)+'n',chr(10)))
          os.chmod(key,0o600)
          PY
          python3 scripts/ci/apple-testflight-status.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: NailMoods-0.8.1-build30002-TestFlight-status
          path: artifacts/ios/*.json
          retention-days: 14
