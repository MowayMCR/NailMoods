name: NailMoods 0.8.1 TestFlight signed delivery
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/release-081-testflight-upload.yml
permissions:
  contents: read
jobs:
  testflight:
    uses: MowayMCR/NailMoods/.github/workflows/ios-testflight.yml@main
    with:
      mode: testflight
      source_ref: ${{ github.sha }}
      build_number: '30002'
    secrets: inherit
