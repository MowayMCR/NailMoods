name: Android integration checks (no store deployment)
on:
  push:
    branches: [feat/google-play-billing-beta6]
    paths: ['src/**', 'public/**', 'android/**', 'scripts/**', 'supabase/**', 'tests/**', 'package*.json', 'vite.mobile.config.js', '.github/workflows/android-billing-beta6.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm test
      - name: Compile Java against the actual Billing library
        env:
          NAILMOODS_MOBILE_ENV: production
        run: |
          node scripts/build-mobile.mjs production
          npx cap sync android
          npm run mobile:assets
          chmod +x android/gradlew
          ./android/gradlew -p android -PnailmoodsEnvironment=production :app:compileDebugJavaWithJavac --console=plain
      - name: Resolve the Billing dependency
        run: ./android/gradlew -p android -PnailmoodsEnvironment=production :app:dependencyInsight --dependency com.android.billingclient --configuration debugRuntimeClasspath --console=plain

      - name: Build Recette debug APK for physical camera validation
        env:
          NAILMOODS_MOBILE_ENV: recette
        run: |
          npm run mobile:recette
          npx cap sync android
          ./android/gradlew -p android -PnailmoodsEnvironment=recette :app:assembleDebug --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: nailmoods-recette-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
