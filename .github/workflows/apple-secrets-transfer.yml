name: Transfer existing Apple secrets to private integration
on:
  push:
    branches: [chore/apple-secrets-transfer-20261013]
    paths: [.github/workflows/apple-secrets-transfer.yml]
  workflow_dispatch:
permissions: {}
concurrency:
  group: apple-secrets-transfer-once
  cancel-in-progress: false
jobs:
  transfer:
    if: github.repository == 'MowayMCR/NailMoods' && github.repository_id == '1372726381' && github.ref == 'refs/heads/chore/apple-secrets-transfer-20261013' && github.actor == 'MowayMCR' && github.triggering_actor == 'MowayMCR'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Transfer seven existing secrets without printing their values
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.NM_APPLE_SECRETS_TRANSFER_TOKEN }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_DISTRIBUTION_P12_BASE64: ${{ secrets.APPLE_DISTRIBUTION_P12_BASE64 }}
          APPLE_DISTRIBUTION_P12_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_P12_PASSWORD }}
          APPLE_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          set +x
          python3 - <<'PY'
          import json, os, subprocess, sys
          
          TARGET = "MowayMCR/NailMoods-Integration"
          NAMES = (
              "APPLE_TEAM_ID",
              "APPLE_DISTRIBUTION_P12_BASE64",
              "APPLE_DISTRIBUTION_P12_PASSWORD",
              "APPLE_PROVISIONING_PROFILE_BASE64",
              "APP_STORE_CONNECT_KEY_ID",
              "APP_STORE_CONNECT_ISSUER_ID",
              "APP_STORE_CONNECT_PRIVATE_KEY",
          )
          def stop(message):
              print(message, flush=True)
              sys.exit(1)
          
          if not os.environ.get("GH_TOKEN"):
              stop("Waiting: add the temporary NM_APPLE_SECRETS_TRANSFER_TOKEN to the source repository, then rerun only this job.")
          missing = [name for name in NAMES if not os.environ.get(name)]
          if missing:
              stop("Missing source secret names: " + ", ".join(missing))
          
          # Pass only the transfer credential to gh, never the Apple secrets in its environment.
          child_env = {key: os.environ[key] for key in ("PATH", "HOME", "GH_TOKEN") if key in os.environ}
          child_env.update(GH_HOST="github.com", GH_PROMPT_DISABLED="1", GH_PAGER="cat")
          def gh(args, data=None):
              try:
                  result = subprocess.run(["gh", *args], input=data, stdout=subprocess.PIPE,
                                          stderr=subprocess.DEVNULL, env=child_env, timeout=60)
              except (OSError, subprocess.TimeoutExpired):
                  stop("GitHub operation failed or timed out. No secret contents are logged.")
              if result.returncode:
                  stop("GitHub operation refused. Check token expiry and Secrets read/write permission on the destination only.")
              return result.stdout
          
          def read_json(args):
              try:
                  return json.loads(gh(args))
              except (ValueError, TypeError):
                  stop("Unexpected GitHub response; transfer stopped.")
          
          repo = read_json(["api", "repos/" + TARGET])
          if repo.get("id") != 1415747992 or repo.get("full_name") != TARGET or repo.get("private") is not True:
              stop("Destination identity or private visibility mismatch.")
          
          def names_at_destination():
              rows = read_json(["secret", "list", "--repo", TARGET, "--app", "actions", "--json", "name"])
              if not isinstance(rows, list):
                  stop("Unexpected secrets metadata.")
              return {row["name"] for row in rows}
          
          existing = names_at_destination()
          created = []
          for name in NAMES:
              if name in existing:
                  print("Preserved existing destination entry: " + name, flush=True)
                  continue
              # gh encrypts the value with the destination public key before sending it.
              # Values are fed through stdin, never command arguments, output or files.
              gh(["secret", "set", name, "--repo", TARGET, "--app", "actions"],
                 data=os.environ[name].encode("utf-8"))
              created.append(name)
              print("Transferred: " + name, flush=True)
          
          if not set(NAMES).issubset(names_at_destination()):
              stop("Destination metadata check failed. Rerunning preserves entries already created.")
          
          message = ("Apple secrets transfer complete: " + str(len(created)) +
                     " created; " + str(len(NAMES) - len(created)) +
                     " existing entries preserved. No tests, builds or Apple calls were run. "
                     "Revoke the temporary token and delete NM_APPLE_SECRETS_TRANSFER_TOKEN from the source repository.")
          print(message)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as report:
              report.write(message + "\n")
          PY
