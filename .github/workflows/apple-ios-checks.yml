name: Apple preparation checks (unsigned, no deployment)
on:
  push:
    branches: [feat/apple-storekit-ios]
    paths: ['src/**','scripts/**','ios/**','tests/**','supabase/**','package*.json','vite*.js','.github/workflows/apple-ios-checks.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ios:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Validate shared Production web payload
        run: |
          npm run mobile:production
          node scripts/check-mobile-build.mjs dist-mobile production
      - run: npm run ios:recette
      - run: node scripts/check-mobile-build.mjs dist-mobile recette
      - name: Toolchain and unsigned simulator build
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          xcodebuild -project ios/App/App.xcodeproj -scheme App -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath /tmp/nailmoods-ios CODE_SIGNING_ALLOWED=NO build
      - name: Unsigned device archive (Recette, cannot upload to TestFlight)
        run: xcodebuild -project ios/App/App.xcodeproj -scheme App -sdk iphoneos -destination 'generic/platform=iOS' -archivePath /tmp/NailMoods-Recette-unsigned.xcarchive CODE_SIGNING_ALLOWED=NO archive
      - uses: actions/upload-artifact@v4
        with:
          name: nailmoods-recette-unsigned-xcarchive
          path: /tmp/NailMoods-Recette-unsigned.xcarchive
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nailmoods-ios-unsigned-build-log
          path: /tmp/nailmoods-ios/Logs/Build
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm run mobile:production
      - run: npx cap sync android
        env:
          NAILMOODS_MOBILE_ENV: production
      - run: npm run mobile:assets
      - run: chmod +x android/gradlew && ./android/gradlew -p android -PnailmoodsEnvironment=production :app:compileDebugJavaWithJavac --console=plain
