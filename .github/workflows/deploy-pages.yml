name: Deploy NailMoods to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths: [web-release/**, .github/workflows/deploy-pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.ref || 'production' }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      # Sources are maintained in the private integration repository.
      # Publish only its verified browser bundle; never copy server or native sources.
      - name: Verify and stage the approved web bundle
        run: |
          cd web-release
          node -e "const r=require('./release.json');if(r.environment!=='production'||r.adMode!=='staff-simulation-only')process.exit(1)"
          cd ..
          mkdir -p dist
          cp -R web-release/. dist/
      - name: Conserver la Web App de recette séparée
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: validation-source
      - name: Préserver la version historique du lien de recette
        working-directory: validation-source
        env:
          VITE_DEPLOYMENT_ENV: recette
          VITE_PRO_V2_ENABLED: 'true'
          VITE_POSE_CYCLE_ENABLED: 'true'
          VITE_CATALOGUE_ADMIN_ENABLED: 'true'
          VITE_PO_LOOP_ENABLED: 'true'
        run: |
          npm ci
          npm run build -- --base /NailMoods/validation-pro-v2/
      - name: Préserver le lien de validation
        run: |
          mkdir -p dist/validation-pro-v2
          cp -R validation-source/dist/. dist/validation-pro-v2/
      - name: Restore deterministic recognition assets and verify all published bytes
        run: |
          cp -R validation-source/dist/recognition dist/
          cd dist
          sha256sum --check SHA256SUMS.txt
          rm SHA256SUMS.txt
      - name: Setup Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
  verify-served:
    if: github.event_name != 'pull_request'
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - name: Verify production revision and served entry bytes
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs/promises';
          import crypto from 'node:crypto';
          const expected=JSON.parse(await fs.readFile('web-release/release.json','utf8'));
          const origin='https://nailmoods.com',checked=[];
          const request=async path=>{const r=await fetch(origin+path+'?verify='+process.env.GITHUB_SHA,{cache:'no-store'});if(!r.ok)throw Error(path+' HTTP '+r.status);return Buffer.from(await r.arrayBuffer());};
          const sha=b=>crypto.createHash('sha256').update(b).digest('hex');
          let served,last;
          for(let attempt=0;attempt<24;attempt++){
            try{served=JSON.parse((await request('/release.json')).toString());if(served.sourceCommit===expected.sourceCommit&&served.journeyRevision===expected.journeyRevision&&served.validation?.sourceCommit===expected.validation?.sourceCommit)break;last='CDN still serves another revision';}catch(e){last=e.message;}
            await new Promise(r=>setTimeout(r,5000));
          }
          if(served?.sourceCommit!==expected.sourceCommit||served?.journeyRevision!==expected.journeyRevision||served?.validation?.sourceCommit!==expected.validation?.sourceCommit)throw Error(last||'Revision mismatch');
          const paths=['/index.html','/atelier-v41/index.html','/atelier-v41/release.json',...(expected.entryAssets||[]),...(expected.validation?['/atelier-v44/index.html','/atelier-v44/release.json',...expected.validation.entryAssets]:[])];
          for(const entry of ['/index.html','/atelier-v41/index.html']){
            const html=await fs.readFile('web-release'+entry,'utf8');
            paths.push(...[...html.matchAll(/(?:src|href)="(\/assets\/[^"?#]+)"/g)].map(m=>m[1]));
          }
          for(const path of [...new Set(paths)]){
            const [actual,local]=await Promise.all([request(path),fs.readFile('web-release'+path)]);
            if(sha(actual)!==sha(local))throw Error('Served bytes differ: '+path);
            checked.push({path,sha256:sha(actual)});
          }
          const result={url:origin,revision:served.journeyRevision,sourceCommit:served.sourceCommit,publicCommit:process.env.GITHUB_SHA,rollout:served.rollout,validation:served.validation,checked,verifiedAt:new Date().toISOString()};
          await fs.writeFile('production-verification.json',JSON.stringify(result,null,2));console.log(JSON.stringify(result));
          JS
      - uses: actions/upload-artifact@v4
        with:
          name: NailMoods-production-served-verification
          path: production-verification.json
          retention-days: 30
