apply plugin: 'com.android.application'

def mobileFile = file('src/main/assets/public/mobile-build.json')
if (!mobileFile.exists()) throw new GradleException('Run the mobile build and cap sync first')
def mobile = new groovy.json.JsonSlurper().parse(mobileFile)
def targetEnvironment = project.findProperty('nailmoodsEnvironment')
if (!(targetEnvironment in ['production','recette']) || mobile.environment != targetEnvironment)
    throw new GradleException('Explicit Android environment must match the embedded web build')
def nativeConfig = new groovy.json.JsonSlurper().parse(file('src/main/assets/capacitor.config.json'))
if (nativeConfig.appId != mobile.appId || nativeConfig.server?.url)
    throw new GradleException('Incorrect app ID or remote server URL')
def uploadStore = System.getenv('NM_UPLOAD_KEYSTORE')


android {
    namespace = "com.nailmoods.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId mobile.appId
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode (mobile.versionCode as int)
        versionName mobile.version
        manifestPlaceholders = [nailmoodsLabel: targetEnvironment == 'production' ? 'NailMoods' : 'NailMoods Recette', nailmoodsScheme: mobile.appId]
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        upload {
            if (uploadStore) {
                storeFile file(uploadStore)
                storePassword System.getenv('NM_UPLOAD_STORE_PASSWORD')
                keyAlias System.getenv('NM_UPLOAD_KEY_ALIAS')
                keyPassword System.getenv('NM_UPLOAD_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            if (uploadStore) signingConfig signingConfigs.upload
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'
